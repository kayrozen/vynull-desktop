[application]
name = "vynull-desktop"

[bundle]
identifier = "dev.vynulldev.vynull-rs"
publisher = "vynull-rs"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/256x256.png", "icons/512x512.png"]
short_description = "A client for the Vynull DJ library daemon"
long_description = "Browse and edit a Vynull library, follow the decks on the Pro DJ Link network, and edit beat grids, cues and playlists from a desktop window."
category = "Music"
copyright = "MIT licensed"

[bundle.deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libasound2 | libasound2t64"]

[bundle.rpm]
depends = ["webkit2gtk4.1", "gtk3", "alsa-lib"]

[bundle.windows]
# dx embeds the full 190 MB WebView2 runtime installer by default. The small bootstrapper (about 2 MB) is enough:
# Windows 11 and current Windows 10 already have WebView2, and it only downloads the runtime when it is missing.
webview_install_mode = { EmbedBootstrapper = { silent = false } }
