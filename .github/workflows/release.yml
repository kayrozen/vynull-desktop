# Builds every package. Pushing a tag `vX.Y.Z` (equal to the version in Cargo.toml) builds them all and
# publishes a GitHub release. Running the workflow by hand ("Run workflow") builds everything and keeps the
# files as workflow artifacts without publishing, which is how to try a change to the packaging.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v" >&2; exit 1
          fi

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev zip
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx build --release --platform web
        working-directory: crates/vynull-web
      - run: |
          mkdir -p out
          (cd target/dx/vynull-web/release/web/public && zip -qr "$GITHUB_WORKSPACE/out/vynull-web-${{ needs.version.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v4
        with: { name: pkg-web, path: out/* }

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, types: '--package-types deb --package-types rpm --package-types appimage' }
          - { os: ubuntu-24.04-arm, arch: aarch64, types: '--package-types deb --package-types rpm' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev libssl-dev file patchelf
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx bundle --release ${{ matrix.types }} --out-dir "$GITHUB_WORKSPACE/out"
        working-directory: crates/vynull-desktop
      - run: ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: "pkg-linux-${{ matrix.arch }}", path: out/* }

  flatpak:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - run: flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Source archive for the manifest
        run: git archive --prefix=vynull-rs/ -o packaging/flatpak/vynull-rs-src.tar.gz HEAD
      - name: Build
        run: >
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo --disable-rofiles-fuse
          build packaging/flatpak/dev.vynulldev.VynullRs.yml
      - name: Bundle
        run: |
          mkdir -p out
          flatpak build-bundle repo "out/vynull-rs-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak" dev.vynulldev.VynullRs
      - uses: actions/upload-artifact@v4
        with: { name: "pkg-flatpak-${{ matrix.arch }}", path: out/* }

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      # macOS and Windows want .icns and .ico icons; the Linux packagers reject them.
      - run: cp crates/vynull-desktop/packaging/Dioxus.icons-mac-win.toml crates/vynull-desktop/Dioxus.toml
      - run: dx bundle --release --package-types dmg --out-dir "$GITHUB_WORKSPACE/out"
        working-directory: crates/vynull-desktop
      - run: ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: pkg-macos, path: out/* }

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: cp crates/vynull-desktop/packaging/Dioxus.icons-mac-win.toml crates/vynull-desktop/Dioxus.toml
        shell: bash
      - run: dx bundle --release --package-types msi --package-types nsis --out-dir "$env:GITHUB_WORKSPACE/out"
        working-directory: crates/vynull-desktop
      - run: Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with: { name: pkg-windows, path: out/* }

  release:
    if: github.ref_type == 'tag'
    needs: [version, web, linux, flatpak, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: 'pkg-*', merge-multiple: true }
      - run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "vynull-rs ${{ needs.version.outputs.version }}"
          --notes-file "docs/release-notes/${{ needs.version.outputs.version }}.md"
