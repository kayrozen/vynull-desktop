name: CI
on: [push, pull_request]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop client needs a webview and the sound backend needs ALSA (Linux only).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p vynull-web --target wasm32-unknown-unknown

  # Builds the Vynull daemon, starts it on a generated fixture library, and
  # runs the `#[ignore]` contract tests against it. Add a tag to the matrix for
  # each Vynull version this client claims to support.
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vynull: [v0.6.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vynulldev/vynull
          ref: ${{ matrix.vynull }}
          path: vynull-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: vynull-src/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo test --workspace` builds the desktop client and the native sound backend too.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libasound2-dev
      - run: go build -o "$RUNNER_TEMP/vynull" .
        working-directory: vynull-src
      - run: ci/run-contract-tests.sh
        env:
          VYNULL_BIN: ${{ runner.temp }}/vynull

  # Builds the web client and the daemon, then drives the client in Firefox
  # against a fixture daemon (ui-tests/). Untested on GitHub: it assumes the
  # runner has Firefox, libssl-dev and python3, and that `dx` installs in time.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vynulldev/vynull
          ref: v0.6.0
          path: vynull-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: vynull-src/go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libssl-dev pulseaudio
      - run: pulseaudio --start --exit-idle-time=-1 && pactl load-module module-null-sink
      - run: cargo install dioxus-cli --version 0.7.10 --locked
      - run: dx build --release --platform web
        working-directory: crates/vynull-web
      - run: go build -o "$RUNNER_TEMP/vynull" .
        working-directory: vynull-src
      - run: ui-tests/run.sh
        env:
          VYNULL_BIN: ${{ runner.temp }}/vynull
