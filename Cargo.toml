[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

vynull-core = { path = "crates/vynull-core" }
vynull-api = { path = "crates/vynull-api" }
vynull-platform = { path = "crates/vynull-platform" }
vynull-ui = { path = "crates/vynull-ui" }
