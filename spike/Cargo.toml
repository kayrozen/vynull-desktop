# Phase 0 spike: is Dioxus fast enough? Throwaway; deleted after the decision.
# Not a workspace member (it has its own lockfile and target dir).
[package]
name = "vynull-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
vynull-api = { path = "../crates/vynull-api" }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "Location", "Performance",
] }
